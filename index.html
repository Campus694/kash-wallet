/* One glass indicator moves independently of the tab buttons. */
html { -webkit-tap-highlight-color: transparent; }
button, input, select, a { -webkit-tap-highlight-color: transparent; }
:where(button, input, select, a):focus { outline: none; }
:where(button, input, select, a):focus-visible {
  outline: 2px solid #aaaab2;
  outline-offset: 3px;
}
input:focus-visible, select:focus-visible {
  outline: 2px solid #aaaab2;
  outline-offset: 2px;
}
#content, .subpage, .history-view { animation: none; }
.floating-nav {
  --inset: 6px;
  --active-tab: 0;
  isolation: isolate;
  gap: 0;
  padding: var(--inset);
  background: #202023d9;
  border-color: #ffffff17;
  box-shadow: 0 12px 36px #0009, inset 0 1px 0 #ffffff0a;
}
.floating-nav::before {
  content: "";
  position: absolute;
  inset: var(--inset) auto var(--inset) var(--inset);
  width: calc((100% - 2 * var(--inset)) / 3);
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(165deg, #ffffff25, #ffffff09);
  box-shadow: inset 0 1px 0 #ffffff24, inset 0 0 0 1px #ffffff0e;
  transform: translate3d(calc(var(--active-tab) * 100%), 0, 0);
  transition: transform 510ms cubic-bezier(.22, 1, .36, 1);
}
.floating-nav button {
  flex: 1 1 0;
  transition: color 320ms ease, transform 280ms cubic-bezier(.22, 1, .36, 1);
}
.floating-nav button.active { background: transparent; box-shadow: none; }
.floating-nav button.active svg { filter: none; }
.floating-nav button:active { transform: scale(.92); filter: none; }


.gram-mark { display: block; border-radius: 50%; object-fit: cover; }
.withdraw-screen { padding: 0 2px; }
.withdraw-screen h2 { font-size: clamp(22px, 6.1vw, 28px); margin: 0; letter-spacing: -.55px; }
.withdraw-card { background: #202b36; border-radius: 25px; padding: 13px; }
.withdraw-summary { margin-top: 23px; padding-block: 0; }
.withdraw-summary > div { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 47px; font-size: 14px; }
.withdraw-summary > div + div { border-top: 1px solid #ffffff18; }
.withdraw-value { display: flex; align-items: center; gap: 5px; color: #a6b0b9; white-space: nowrap; }
.withdraw-value img { width: 16px; height: 16px; }
.withdraw-value.is-short { color: #fa696f; }
.withdraw-form { margin-top: 18px; padding: 16px; }
.withdraw-form label:first-child { margin-top: 0; }
.amount-input button { position: absolute; right: 10px; top: 8px; padding: 8px; color: #b7dff5; }
.withdraw-preview { overflow-wrap: anywhere; line-height: 1.6; }
.profile-identity { display: grid; justify-items: center; gap: 14px; margin: 12px 0 29px; }
.profile-identity img { width: 84px; height: 84px; }
.profile-identity h2 { margin: 0; font-size: 25px; text-align: center; overflow-wrap: anywhere; }
.profile-links { display: grid; gap: 9px; }
.profile-links .asset-pill { min-height: 65px; }
.profile-links strong { font-size: 16px; }
.profile-link-icon { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 12px; background: #ffffff0e; font-size: 19px; }
.profile-chevron { margin-left: auto; color: #92929d; font-size: 23px; }
.settings-toggle { display: flex; justify-content: space-between; align-items: center; color: inherit; }
.settings-toggle input { width: 20px; height: 20px; accent-color: #9696a1; }

:root {
  --glass-fill: linear-gradient(152deg, #ffffff17, #ffffff06 42%, #00000015), #17171bd9;
  --glass-edge: #ffffff22;
  --glass-depth: inset 0 1px 0 #ffffff20, inset 0 -1px 0 #0008, 0 12px 26px #0005;
}
.action-btn, .asset-pill, .glass-block, .withdraw-card, dialog {
  background: var(--glass-fill);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--glass-depth);
  backdrop-filter: blur(24px) saturate(135%);
  -webkit-backdrop-filter: blur(24px) saturate(135%);
}
.floating-nav {
  background: linear-gradient(155deg, #323237d9, #161619e8 72%);
  border-color: var(--glass-edge);
  box-shadow: var(--glass-depth), 0 10px 32px #0008;
}
.floating-nav::before {
  background: linear-gradient(150deg, #ffffff36, #ffffff11 56%, #ffffff08);
  box-shadow: inset 0 1px 1px #ffffff3d, inset 0 -1px 0 #ffffff0e, 0 4px 10px #0004;
}
.withdraw-screen { padding: 5px 0 0; }
.withdraw-screen h2 { margin-bottom: 18px; }
.withdraw-form, .withdraw-summary { margin-top: 11px; border-radius: 25px; padding-inline: 17px; }
.withdraw-form label { margin: 0 0 9px; color: #ababaf; }
.withdraw-form input { font-size: 16px; min-width: 0; }
.withdraw-amount { display: flex; align-items: center; gap: 8px; }
.withdraw-amount input {
  flex: 1; width: 0; padding: 5px 0; border: 0; background: transparent;
  font: 600 clamp(30px, 9vw, 42px)/1.18 BalanceInter, Inter, sans-serif;
  letter-spacing: -.045em; box-shadow: none;
}
.withdraw-amount input:focus { box-shadow: none; }
.withdraw-amount span {
  display: flex; align-items: center; gap: 6px; padding: 6px 9px;
  border-radius: 999px; background: #ffffff10; color: #d1d1d6; font-size: 12px;
}
.withdraw-amount img { width: 20px; height: 20px; }
.withdraw-summary output { font-variant-numeric: tabular-nums; }
#withdraw-error:empty { display: none; }
.withdraw-submit { margin-top: 13px; }

.withdraw-amount input,
.withdraw-amount input:focus,
.withdraw-amount input:focus-visible {
  border: 0; outline: 0; box-shadow: none; background: transparent;
}
.withdraw-amount input { caret-color: #f1f1f4; }
.withdraw-amount:focus-within input::placeholder { color: #96969e; }
.fee-spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid #ffffff22; border-top-color: #d7d7df;
  animation: fee-spin .65s linear infinite;
}
@keyframes fee-spin { to { transform: rotate(1turn); } }

.primary, .action-btn {
  --button-depth: 5px;
  transform: translateY(0);
  transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
}
.primary {
  background: linear-gradient(173deg, #f0f0f4 2%, #dadade 41%, #b6b6bf 100%);
  box-shadow: inset 0 1px 0 #fff, inset 0 -2px 2px #34343e39,
    0 var(--button-depth) 0 #676773, 0 12px 19px #0008;
}
.action-btn {
  background: linear-gradient(160deg, #444449, #29292f 44%, #1b1b20);
  box-shadow: inset 0 1px 0 #ffffff36, inset 0 -1px 1px #0008,
    0 var(--button-depth) 0 #101014, 0 10px 17px #0008;
}
.action-col { gap: 12px; }
.action-col:active { transform: none; filter: none; }
.primary:active, .action-col:active .action-btn {
  --button-depth: 1px;
  transform: translateY(4px);
  filter: none;
}

main { padding-bottom: 36px; }
#modal {
  position: fixed; inset: auto 0 0; margin: 0 auto;
  width: min(100%, 450px); max-width: none; max-height: min(86dvh, 720px);
  padding: 12px 19px max(22px, env(safe-area-inset-bottom));
  border-radius: 29px 29px 0 0;
  background: linear-gradient(155deg, #252529, #151517 65%);
  box-shadow: 0 -12px 44px #0007, inset 0 1px 0 #ffffff10;
}
#modal[open] { animation: bottom-sheet-in .46s cubic-bezier(.22, 1, .36, 1) both; }
#modal::backdrop { background: #0009; }
@keyframes bottom-sheet-in { from { transform: translateY(100%); } to { transform: translateY(0); } }
#sheet-title { margin: 0 0 16px; outline: none; }
#modal .primary, #modal .primary:active {
  background: #dcdce1; color: #17171a; box-shadow: none;
}
#modal .primary:active { transform: scale(.985); background: #c9c9d0; }
.receive-qr { display: grid; place-items: center; margin: 3px 0 17px; }
.receive-qr img { width: min(188px, 55vw); height: auto; border-radius: 16px; }
.receive-address { padding: 13px 15px; border: 1px solid #ffffff14; background: #ffffff08; border-radius: 17px; }
.receive-address span { display: block; color: #a8a8af; margin-bottom: 6px; font-size: 12px; }
.receive-address code { overflow-wrap: anywhere; user-select: all; }
.receive-note { margin: 10px 1px 0; font-size: 12px; }
#withdraw-form .withdraw-card { box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }

#modal { padding-top: 22px; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}
.withdraw-amount .withdraw-unit { padding: 0; background: none; }
.withdraw-amount .withdraw-unit img { width: 32px; height: 32px; }
.action-btn, #modal .primary {
  position: relative;
  transition: transform 260ms cubic-bezier(.2,.8,.2,1), box-shadow 260ms ease;
}
.action-btn {
  border-radius: 22px;
  background: linear-gradient(163deg, #343438, #232326 80%);
  border: 1px solid #ffffff1a;
  box-shadow: inset 0 1px 1px #ffffff20, inset 0 -2px 3px #0003, 0 4px 8px #0006;
}
#modal .primary {
  border: 1px solid #ffffff52;
  border-radius: 21px;
  background: linear-gradient(170deg, #e4e4e8, #c8c8ce);
  box-shadow: inset 0 1px 1px #ffffffa0, inset 0 -2px 2px #0002, 0 4px 8px #0005;
}
.action-col:active .action-btn, #modal .primary:active {
  transform: translateY(2px) scale(.985);
  box-shadow: inset 0 1px 2px #0002, 0 1px 3px #0004;
}
#modal .primary:active { background: linear-gradient(170deg, #dedee3, #c1c1c8); }
</style><main><div id="content"></div></main><dialog id="modal" aria-labelledby="sheet-title"></dialog><script>
const assets=[['GRAM','GRAM','','gram','0','0.00']];let hidden=localStorage.getItem("hideBalance")==="true";const content=document.querySelector('#content'),modal=document.querySelector('#modal');
function rows(){return assets.map(a=>`<button class="asset-pill" onclick="asset('${a[1]}')" aria-label="Открыть баланс GRAM"><img src="gram-logo.webp" alt="" width="46" height="46"><strong>${a[1]}</strong><span class="asset-pill-amount">${hidden?'••••':a[4]}</span></button>`).join('')}
function page(){content.innerHTML=`<section class="balance-section"><button class="balance-label-row" onclick="toggleBalance();page()" aria-label="Скрыть или показать баланс"><span class="balance-label">Общий баланс</span><svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M1.8 9C3.3 5.8 5.9 4.2 9 4.2C12.1 4.2 14.7 5.8 16.2 9C14.7 12.2 12.1 13.8 9 13.8C5.9 13.8 3.3 12.2 1.8 9Z" stroke="currentColor" stroke-width="1.3"/><circle cx="9" cy="9" r="2.1" stroke="currentColor" stroke-width="1.3"/></svg></button><div class="balance-amount-row"><span class="balance-val">${hidden?'••••':'0.00'}</span><span class="balance-curr">USD</span></div></section><div class="actions-row"><button class="action-col" onclick="showWithdrawal()"><span class="action-btn"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 15.5V4.5M10 4.5L5.5 9M10 4.5L14.5 9" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="action-label">Перевести</span></button><button class="action-col" onclick="receive()"><span class="action-btn"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4.5V15.5M10 15.5L5.5 11M10 15.5L14.5 11" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="action-label">Получить</span></button></div><h2 class="assets-title">Мои активы</h2><div class="assets-list">${rows()}</div>`}
function open(title, body, showTitle = true) {
  modal.innerHTML = '<h2 id="sheet-title" tabindex="-1" autofocus></h2>' + body;
  modal.querySelector('#sheet-title').classList.toggle('visually-hidden', !showTitle);
  modal.querySelector('#sheet-title').textContent = title;
  if (!modal.open) modal.showModal();
}

function receive() {
  open('Получить GRAM', `
    <div class="receive-qr"><img src="receive-demo.svg" alt="QR демонстрационного адреса" width="188" height="188"></div>
    <div class="receive-address"><span>Адрес в сети TON</span><code>GRAM-DEMO-ADDRESS</code></div>
    <p class="note receive-note">Демо-адрес. Адрес для пополнения появится после подключения кошелька.</p>
    <button class="primary" onclick="modal.close()">Понятно</button>
  `, false);
}

function asset(c){const a=assets.find(x=>x[1]===c);open(a[0],'<div class="balance"><h1>'+a[4]+'</h1><p>'+c+' ≈ '+a[5]+' $</p><span class="demo">Демонстрационный баланс</span></div><button class="primary" onclick="receive()">Получить</button><button class="primary" onclick="showWithdrawal()">Перевести</button>')}
// Use integer nano-units for balance, fees, and entered amounts.
const nanoGram = 1_000_000_000;
const minWithdrawal = 500_000;
const withdrawalFee = 100_000;
const gramLogo = '<img src="gram-logo.webp" alt="" class="gram-mark">';
const demoBalance = Math.round(Number(assets[0][4]) * nanoGram);
const formatGram = value => (value / nanoGram).toFixed(9).replace(/\.?0+$/, '');

function toggleBalance() {
  hidden = !hidden;
  localStorage.setItem('hideBalance', String(hidden));
}

function showWithdrawal() {
  open('Перевести GRAM', `
    <form id="withdraw-form" novalidate>
      <div class="withdraw-card withdraw-form">
        <label for="amount">Сумма</label>
        <div class="withdraw-amount">
          <input id="amount" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-describedby="withdraw-error">
          <span class="withdraw-unit" role="img" aria-label="GRAM">${gramLogo}</span>
        </div>
      </div>
      <div class="withdraw-card withdraw-form">
        <label for="recipient">Адрес в сети TON</label>
        <input id="recipient" placeholder="Введите адрес" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="withdraw-error">
      </div>
      <div class="withdraw-card withdraw-summary">
        <div><span>Комиссия сети</span><output class="withdraw-value" id="withdraw-fee" for="amount" aria-live="polite">—</output></div>
      </div>
      <p id="withdraw-error" class="error" role="alert"></p>
      <button class="primary withdraw-submit" type="submit">Перевести</button>
    </form>`);
  const form = modal.querySelector('#withdraw-form');
  const amount = form.elements.amount;
  const fee = form.querySelector('#withdraw-fee');
  let feeTimer;

  form.addEventListener('input', () => {
    form.querySelector('#withdraw-error').textContent = '';
  });
  amount.addEventListener('input', () => {
    clearTimeout(feeTimer);
    if (!(parseWithdrawalAmount(amount.value) > 0)) {
      fee.textContent = '—';
      return;
    }
    fee.innerHTML = '<span class="fee-spinner" role="img" aria-label="Оценка комиссии"></span>';
    feeTimer = setTimeout(() => {
      fee.textContent = '≈ ' + formatGram(withdrawalFee) + ' GRAM';
    }, 420);
  });
  form.addEventListener('submit', reviewWithdrawal);
}

function parseWithdrawalAmount(input) {
  const normalized = input.trim().replace(',', '.');
  if (!/^\d*(?:\.\d{1,9})?$/.test(normalized)) return NaN;
  const [whole, fraction = ''] = normalized.split('.');
  const value = Number(whole) * nanoGram + Number(fraction.padEnd(9, '0'));
  return Number.isSafeInteger(value + withdrawalFee) ? value : NaN;
}

function reviewWithdrawal(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const value = parseWithdrawalAmount(form.elements.amount.value);
  const address = form.elements.recipient.value.trim();
  const error = form.querySelector('#withdraw-error');
  if (!Number.isFinite(value) || value < minWithdrawal) {
    error.textContent = 'Минимальная сумма вывода — ' + formatGram(minWithdrawal) + ' GRAM.';
    form.elements.amount.focus();
    return;
  }
  if (value + withdrawalFee > demoBalance) {
    error.textContent = 'Не хватает ' + formatGram(value + withdrawalFee - demoBalance) + ' GRAM с учётом комиссии.';
    return;
  }
  if (!/^(?:(?:0|-1):[a-fA-F0-9]{64}|[A-Za-z0-9_-]{48})$/.test(address)) {
    error.textContent = 'Введите адрес в формате TON.';
    form.elements.recipient.focus();
    return;
  }
  open('Проверка вывода', '<p id="summary" class="withdraw-preview"></p><p class="note">Отправка станет доступна после подключения сервера кошелька.</p><button class="primary" onclick="modal.close()">Готово</button>');
  document.querySelector('#summary').textContent = formatGram(value) + ' GRAM → ' + address + ' · комиссия ' + formatGram(withdrawalFee) + ' GRAM';
}

modal.addEventListener('click', event => {
  if (event.target !== modal) return;
  const rect = modal.getBoundingClientRect();
  if (event.clientX < rect.left || event.clientX > rect.right ||
      event.clientY < rect.top || event.clientY > rect.bottom) modal.close();
});
page();
</script></html>
